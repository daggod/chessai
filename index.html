<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess AI Demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <section class="panel board-panel">
      <h1>Chessboard</h1>
      <div id="board" class="board"></div>
      <div class="status-row">
        <span id="turnInfo">Turn: White</span>
        <button id="resetBtn">Reset</button>
      </div>
    </section>

    <section class="panel ai-panel">
      <h1>AI Response</h1>
      <textarea id="aiWindow" readonly placeholder="AI response will appear here..."></textarea>
      <button id="aiExampleBtn">Generate Example Response</button>
    </section>

    <section class="panel moves-panel">
      <h1>Move History</h1>
      <ol id="moveHistory"></ol>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
